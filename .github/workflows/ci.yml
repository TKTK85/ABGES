name: ABGES CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 【S4】与本机实测环境对齐（本机为 3.14.2）。
          # 注意：requirements*.lock 是按 3.14 解析并钉死的版本，
          # 若需支持 3.11 必须单独解析并生成对应的 lock 文件。
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      # 【S4】改为哈希校验安装，杜绝供应链投毒与版本漂移。
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      # 【S2】YAML 语法全量校验：任一 configs 下配置解析失败即阻断。
      # 历史上 column-aliases.yaml 因一处中文引号未转义导致整份 478 行配置静默失效。
      - name: YAML 语法全量校验
        run: |
          python -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('configs/**/*.yaml',recursive=True)]"
      # 公共 CI 只验证 Python 环境；引擎未随仓库分发。
      # 部署机另执行 --require-engines 验证本地引擎完整性。
      - run: python scripts/check_environment.py --json
      # 【S9/M10】漂移哨兵：三份 stage_runner 同名函数相似度较基线下降超 0.15 即阻断，
      #       提示人工确认是「有意特化」还是「无意识漂移」。
      #       基线文件：scripts/runner_similarity_baseline.json（用 --update 重算）
      - name: stage_runner 相似度漂移检查
        run: python scripts/check_runner_similarity.py
      # 【S8】覆盖率源与 --strict-markers 已统一放在 pytest.ini 的 addopts，
      #      此处只叠加「阈值」——确保门禁仅在 CI 全量运行时生效。
      #      阈值依据：2026-10-21 实测 130 用例 / 8295 行，总覆盖率 35.4%，
      #      首轮棘轮取 30%（留 5 个百分点余量防偶发波动），目标逐步上调至 40% → 60%。
      - run: python -m pytest -q --cov-fail-under=30

  # 【M5】全新环境安装冒烟：只用 requirements.txt（区间声明）从头装一遍，
  # 用于暴露"代码实际 import 但未在 requirements 中声明"的依赖缺口。
  # 历史上 matplotlib / chardet / openpyxl 正是因此长期缺失。
  fresh-install-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: 运行时依赖 import 冒烟
        run: |
          python -c "import pandas, numpy, scipy, yaml, docx, matplotlib, openpyxl; print('fresh install imports OK')"
      - run: python -m pytest -q
