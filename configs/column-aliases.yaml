# ---------------------------------------------------------------------------
# 歧义别名说明（ambiguous aliases）
# ---------------------------------------------------------------------------
# 以下别名可能对应多个标准代码，需人工确认后再正式纳入 aliases。
# 当前处理策略：列在此处，在自动检测时跳过，由 unknown_columns 兜底。
ambiguous:
  - alias: 父
    candidates: [Sire, ID]      # 在某些表中翅号列名含"父"字样，需按表语义判断
    resolution: '翅号列名含"父"字样时，人工确认后明确为 Sire 或 ID'
