# ABGES 统一列名别名注册表（column-aliases）
# =========================================================
# 用途：全系统列名标准化的单一权威数据源。
#       替换分散在三处的别名定义：
#         - header_translation.yaml 的 46 条 chinese_to_code
#         - phenotype-qc.yaml 的 header_map（155+ 条）
#         - trait-registry.yaml 的 name_cn 字段
#
# 优先级（列名检测顺序）：
#   P1. 本表 aliases（含精确匹配 + 大小写折叠 + 空格归一）
#   P2. pypinyin 拼音首字母兜底（只针对中文列）
#   P3. unknown_columns 处理（落入 UX_ 前缀，交人工）
#
# 冲突处理规则：
#   - 同一别名映射到多个标准代码 → 保留优先级最高的角色，报歧义告警
#   - 同一标准代码有多个别名 → 全部保留，覆盖完整
#   - 标准代码以 trait-registry.yaml 的 trait_id 为准
#
# 版本历史：
#   v1.0  2026-10-16  初版，从三处配置合并去重建立
# =========================================================

version: "1.0"
updated: "2026-10-16"

# ---------------------------------------------------------------------------
# 标识字段（role: id）
# ---------------------------------------------------------------------------
