pedigree_cols: ["Sire", "Dam"]

# ---------------------------------------------------------------------------
# 未知 / 中文表头 → 英文代号 自动处理（2026-10-13 新增，先生定调：中文固定效应全部转英文）
# ---------------------------------------------------------------------------
# 设计详见 docs/未知性状与固定效应自动处理方案_v1.1.md。核心约定：
#   - 凡中文表头一律转换为英文代号；三级优先级：注册表 name_cn → 人工词典 → pypinyin 兜底。
#   - 英文表头保持不变，交由显式请求逻辑处理（不静默改选）。
#   - 转换出的「中文来源固定效应」默认自动纳入建模；连续型中文列仅登记为候选、默认不自动入模，
#     以免污染模型（避免静默注入未知性状），需人工复核或显式打开 auto_register_unknown_traits。
#   - 任何转换/纳入/跳过均写 change_log 并告警，原始中文名落盘映射表可追溯。
unknown_columns:
  enabled: true
  # 三级优先级开关（任意一级失败才降级到下一级）
  use_registry_name_cn: true
  use_dictionary: true
  use_pinyin_fallback: true
  # 内容分类启发式阈值（一律来自配置，禁止硬编码）
  numeric_ratio_min: 0.5
  fixed_max_levels: 30
  id_uniqueness_ratio: 0.9
  # 超出三级优先级时的保底代号前缀
  fallback_prefix: "UX_"
  # 治理开关：中文来源的未知列是否自动纳入
  auto_include_unknown_fixed_effects: true
  auto_register_unknown_traits: false
  # 由 Harness 注入当前 run 的 intermediate 目录；独立调用 QC 时不落盘。
  map_output: null

# ---------------------------------------------------------------------------
# 输入数据状态声明（默认值；实际取值由 task.pre_standardized 注入）
# ---------------------------------------------------------------------------
# 背景：上游流程可能已对部分性状做过标准化（如按 Batch×Gen 组内 z-score）。
# 此时列中存放的是无量纲 z 值，与 trait-registry 中基于原始观测的
# value_range 不在同一量纲；若直接套用会把绝大多数正常记录判为超范围。
# 本节用于显式声明该状态，使 PH006（原 PH008）按正确尺度判定。
#
# 铁律：声明只改变"判定尺度"，不取消任何规则；
#       每次生效都必须写入 change_log 与交付报告，禁止静默放行。
input_state:
  pre_standardized_traits: []     # 例：["ACL", "EN", "ER"]
  standardization_scope: []       # 例：["Batch", "Gen"]，仅作审计记录
  standardization_method: null    # 例："z-score"，仅作审计记录

# ---------------------------------------------------------------------------
# QC 规则（每条带 rule_id，change_log 必须引用；编号连续 PH001–PH007）
# ---------------------------------------------------------------------------
rules:

  PH001:
    name: "必备列存在性检查（个体号与目标性状列）"
    action: BLOCK
    merged_from: ["PH001@1.0", "PH004@1.0"]
    description: >-
      标准化后数据须同时具备个体标识列（ID，翅号/个体号）与本次分析请求的全部目标性状列，
      二者分别为表型记录同系谱、基因型数据对接及遗传评估建模的前提。
      任一缺失即整体阻断，并列出缺失列清单。

  PH002:
    name: "个体号缺失与重复记录处理"
    action: EXCLUDE
    merged_from: ["PH002@1.0", "PH003@1.0"]
    description: >-
      个体号缺失（空值、NA、纯空白）的记录无法参与个体间配对，直接剔除并记入 change_log；
      同一个体号出现多条记录时按 duplicate_policy 处理：flag 仅标记不删，
      deduplicate 则按 keep 策略去重并记录 change_log。父母信息冲突的重复不自动择一，
      升级人工确认。
    duplicate_policy: "flag"      # flag | deduplicate
    keep: "first"                 # first | last

  PH003:
    name: "性状数值化转码"
    action: WARNING
    merged_from: ["PH005@1.0"]
    description: >-
      目标性状与协变量列须为数值型度量。发现无法转换为数值的取值（如混入的
      文本、全角数字、单位残留）时，仅提醒并保留原值清单交由人工处置，**禁止
      任何模块私自将其置换为 NA**；本规则触发即阻断后续流程，待人工清洗后
      再行评估，不得静默放行。

  PH004:
    name: "缺失值保持策略"
    action: KEEP
    merged_from: ["PH007@1.0"]
    description: >-
      性状及固定效应、协变量的缺失观测一律保持 NA，严禁任何无统计学依据的填补
      （含前向填充、均值填补）；含 NA 记录由 HIBLUP 在混合模型方程组装配时自动剔除。
    forbid_imputation: true

  PH005:
    name: "固定效应有效水平检查"
    action: WARNING
    code: "E022"
    merged_from: ["PH009@1.0"]
    description: >-
      固定效应列（世代、批次、性别等）的有效水平数 < 2 时该效应在设计矩阵中不可估，
      命令组装层将省略该列；省略必须在交付说明中显式声明，禁止静默忽略。
    min_levels: 2

  PH006:
    name: "分组异常值剔除"
    action: EXCLUDE
    merged_from: ["PH008@1.0"]
    description: >-
      在 Gen×Batch（世代×批次）分组内，按组均值 ± threshold 倍标准差识别并剔除
      离群表型值；组内样本量低于 min_group_size 时统计量不可靠，该组不执行剔除。
      性状被任务声明为"已按同一分组标准化"时，依 skip_when_pre_standardized
      跳过二次剔除并记录，避免在标准化尺度上过度剔除。
    # 【口径裁定 2026-08-07】阈值锁定 3.0 SD，未经明确指令不得变更。
    threshold: 3.0
    min_group_size: 5
    group_by: ["Gen", "Batch"]
    single_pass: true            # 只做一轮，避免迭代式过度剔除
    skip_when_pre_standardized: true

  PH007:
    name: "标准化"
    action: BLOCK
    merged_from: ["PH010@1.0"]
    description: >-
      单性状分析模式必须恰好指定 1 个性状，默认不做标准化（EBV 保持原始观测尺度）；
      多性状分析模式必须至少 2 个性状，同样不做标准化，各性状保持原始量纲，
      以保证方差组分与育种值估计同原始尺度结果可比（h² 与遗传相关为尺度无关量，不受影响）。
      【2026-10-12 修订，先生指令】原口径为"多性状强制 z-score 标准化，禁止关闭"，
      现改为多性状默认不标准化；量纲差异极大的性状组合（如体重与产蛋数同模）
      若出现收敛困难，可经 human-in-the-loop 将 multi_force_standardize 改回 true
      恢复强制标准化，改动须记入 change_log。
    single_default_standardize: false
    multi_force_standardize: false

  # PH008 样本量充足性门控（max_drop_rate=0.30 / min_valid_n=30）已于 2026-08-17 删除：
  #   2026-09-14：PH008 编号复用为数值列重复/错位检测（源自原版数据质量审计 skill）。

  PH008:
    name: "数值列重复/错位检测"
    action: WARNING
    description: >-
      对所有数值型列两两计算 Pearson 相关系数与平均绝对差。若 |r| 大于等于 corr_threshold
      且 mean(abs_diff) 小于等于 abs_diff_threshold，判定为两列在数值上完全相同
      （典型场景：Excel 复制粘贴列、导出工具重复写出同一指标），会导致下游相关性矩阵
      出现 r=1.000 的伪相关、模型设计矩阵共线。本规则仅告警并列出重复列对，不自动删除。
    corr_threshold: 0.999
    abs_diff_threshold: 1e-6
    skip_columns: ["ID", "Sire", "Dam"]

  PH009:
    name: "派生比率恒等检测"
    action: WARNING
    description: >-
      对列名匹配比率类模式（含 率 / pct / ratio / rate 或单位为百分号）的列，检查其标准差。
      若 std 小于等于 std_threshold（该列在全群几乎恒为同一值），判定为派生比率恒等——
      典型 bug 是屠体重=活体重导致屠宰率恒=100%。本规则仅告警，不自动修改。
    std_threshold: 0.01
    ratio_patterns: ["率", "pct", "Pct", "PCT", "ratio", "Ratio", "RATIO", "rate", "Rate", "RATE", "%"]

  PH010:
    name: "分类列水平编码一致性"
    action: WARNING
    description: >-
      对固定效应/分类列（Sex/Gen/Batch/House/Row 等），检测同一语义是否存在多种写法。
      例如 Sex 列同时出现 母/雌/F/female，会导致同一水平被拆成多个 dummy 变量。
      本规则基于内置同义词组检测，列出可疑水平值清单，不自动合并。
    synonym_groups:
      sex_female: ["母", "雌", "F", "f", "female", "Female", "FEMALE", "母鸡"]
      sex_male:   ["公", "雄", "M", "m", "male", "Male", "MALE", "公鸡"]
      yes:        ["是", "Y", "y", "yes", "Yes", "YES", "1", "TRUE", "true", "True"]
      no:         ["否", "N", "n", "no", "No", "NO", "0", "FALSE", "false", "False"]
  #   删除后不再对"清洗后样本下降>30%"请求人工确认，也不再对"有效记录<30"阻断遗传评估。
  #   若后续需恢复，从 merged_from PH011@1.0 / PH012@1.0 重建。

# ---------------------------------------------------------------------------
# 处理前后统计（强制项，所有表型处理必须产出）
# ---------------------------------------------------------------------------
statistics:
  continuous_metrics:
    - N
    - ValidN
    - Missing
    - MissingPct
    - Mean
    - SD
    - Variance
    - CV
    - Min
    - P1
    - P5
    - P25
    - Median
    - P75
    - P95
    - P99
    - Max
  # 存在下列分组字段时，额外按组统计
  group_by_candidates: ["Gen", "Batch", "Sex", "House", "Row"]
  before_after_comparison: true

# ---------------------------------------------------------------------------
# 表型数据探索（2026-10-17 新增，方案见 docs/ABGES_表型数据探索方案_v1.0.md）
# ---------------------------------------------------------------------------
# 铁律：阈值一律外置在此，代码不得硬编码；scipy/matplotlib 缺失时降级告警，
#       绝不阻断评估主流程。分布检验与共线性诊断结果供阶段 06 固定效应筛选参考。
exploration:
  enabled: true                  # 探索环节默认开启

  # ---- 描述统计补充项（在 statistics.continuous_metrics 之外追加）----
  descriptors:
    iqr: true                    # 四分位距 Q3-Q1
    outlier_3sd: true            # 超出 mean±3SD 的个体数
    outlier_3q: true             # 超出 Q1-3·IQR ~ Q3+3·IQR 的个体数（极端离群）
    group_extended: true         # 分组统计扩展为 N/Mean/SD/CV（原仅 N/Mean）

  # ---- 分布（正态性）检验 ----
  # 判定按样本量分层，大样本不迷信 P 值（SW 在 n>5000 功效过强必拒绝正态）
  distribution:
    small_sample_n: 200          # n ≤ 此值：以 SWTest.P 为主判据
    sw_max_n: 5000               # n > 此值：不看 P 值，只看偏度/峰度/图形
    skew_normal_max: 0.5         # |偏度| < 此值 判近似正态
    skew_warn_max: 1.0           # |偏度| > 此值 判明显偏态（需处理建议）
    kurtosis_normal_max: 1.0     # |峰度| < 此值 判近似正态
    kurtosis_warn_max: 3.0       # |峰度| > 此值 判重尾/尖峰
    ks_enabled: true             # 大样本备用：K-S 检验

  # ---- 共线性诊断 ----
  # 严重共线仅告警（先生拍板 2026-10-17），不阻断建模
  collinearity:
    action: "warn"               # warn | block（默认 warn，改动须记 change_log）
    corr_warn: 0.8               # |r| ≥ 此值 警惕
    corr_severe: 0.95            # |r| ≥ 此值 严重（须删列/合并）
    vif_warn: 5                  # VIF ≥ 此值 警惕
    vif_severe: 10               # VIF ≥ 此值 严重（不可与其余同时入模）
    condition_number_severe: 30  # 条件数 κ ≥ 此值 严重（设计矩阵病态）
    # 恒等/近恒等列快速短路（对应 PH008 极端共线特例）
    identical_corr: 0.999

# ---------------------------------------------------------------------------
# 数据驱动的效应筛选建议（2026-10-17 新增，方案见 docs/ABGES_数据驱动效应筛选方案_v1.0.md）
# ---------------------------------------------------------------------------
# 解决的问题：入模效应此前只来自"配置默认 / 任务指定 / PH005 可估性"，
# 除"能不能算"外从未判断"该不该入模"，换一批数据仍是同一套模板。
# 本段依据当前数据本身的统计证据（单因素 η²、水平样本量、均衡性、共线性、相关性）
# 逐列给出 keep / drop / choose_one / review 建议。
#
# 铁律：
#   - 阈值一律外置在此，代码不得硬编码。
#   - 本段只做"数据驱动的诊断 + 提示"：逐列给出 keep/drop/choose_one/review 建议，
#     供用户参考；是否采纳、是否入模始终由用户任务要求决定（先生拍板 2026-10-17），
#     程序不代劳剔除，effective_* 保持 PH005 之后原样。
#   - 任何诊断结论均在报告中透明展示，禁止静默（沿用 PH005"禁止静默忽略"铁律）。
effect_screening:
  enabled: true

  # ---- 判据 1：可估性（与 PH005.min_levels 同值，不另立标准）----
  min_levels: 2

  # ---- 判据 2：水平样本充足性 ----
  # 某水平个体数过少时，该水平效应估计会被少数个体偶然表现主导，进而污染同组其他个体 EBV
  min_level_n: 5

  # ---- 判据 3：分布均衡性 ----
  min_level_share: 0.01        # 最小水平占比低于此值提示失衡
  imbalance_ratio: 50          # 最大水平 N / 最小水平 N 超过此值提示失衡

  # ---- 判据 4：解释力（单因素 ANOVA，本模块的核心）----
  # η² = SS组间 / SStotal，即该效应单独解释的表型变异比例
  eta_squared_min: 0.01        # η² 低于此值即建议剔除（唯一门槛；P 仅透明展示、不参与判定）
  eta_squared_strong: 0.05     # η² 高于此值在报告中标"核心效应"

  # ---- 判据 6：协变量相关性（连续协变量不用 η²，改用相关性）----
  covariate_corr_min: 0.05     # |r| 低于此值 → 建议不入模

  # ---- 判据 5：共线性（复用 exploration.collinearity 的判据与阈值，不重复定义）----
  reuse_collinearity: true

# --------------------------------------------------------------------
# 报告统计判据阈值（P2-3 外置，2026-10-21）
# --------------------------------------------------------------------
# 原先这些阈值硬编码在 runners/docx_report.py 的渲染主体内
# （_p_sig 与残差诊断段落），改口径必须动渲染代码。现统一外置：
#   · 判定分支读这里的数值；
#   · 判定文案里的数字也由同一数值格式化生成，杜绝"阈值改了、文字没改"；
#   · 本段缺失、非法或数值类型不符时，一律回退 runners/report_stats.py
#     的 DEFAULTS（与本次迁移前的历史口径逐值一致），报告输出不受影响。
report_thresholds:
  # --- 显著性水平 ---
  alpha: 0.05             # P<0.05 视为显著
  alpha_strong: 0.001     # P<0.001 视为极显著

  # --- P 值显示口径：极小值给阈值，其余保留三位小数 ---
  p_display_floor: 0.0001
  p_display_floor_2: 0.001
  p_display_nd: 3

  # --- 遗传力分档 ---
  h2_low: 0.10             # h²<0.10 低遗传力
  h2_moderate: 0.30        # 0.10≤h²<0.30 中等；≥0.30 中高

  # --- 超 3SD 离群个体占比告警线 ---
  outlier_share_warn: 0.05

  # --- 残差形态判据（列表展示用分档）---
  skew_symmetric: 0.5      # |偏度|<0.5 近似对称
  skew_mild: 1.0           # |偏度|<1 轻度，否则明显
  kurt_near_normal: 0.5    # |超额峰度|<0.5 视为接近正态

  # --- 近似正态综合判定（严格档 / 宽松档）---
  shape_strict_skew: 0.5
  shape_strict_kurt: 1.0
  shape_loose_skew: 1.0
  shape_loose_kurt: 2.0

  # --- 残差–拟合值二次项 R² 增量分档 ---
  quad_gain_none: 0.01     # <0.01 无明显系统弯曲
  quad_gain_mild: 0.05     # <0.05 轻度；≥0.05 明显且建议核查重估

  # --- 残差均值"判定为零"的相对容差（乘以 sd）---
  mean_zero_rel_tol: 0.001

  # --- 平均近交系数低于此值即表述为"极低" ---
  inbreeding_low: 0.01
