# ABGES 表型质量控制规则
# 本文件是表型 QC 的正式阈值与规则源。Agent 不得自行修改本文件中的正式阈值；
# 需要临时调整时必须走 human-in-the-loop 人工确认，并在 change_log 中记录 rule_id。
# 2026-08-17：规则同类合并与连续重编号（v1.1），畜牧兽医专业术语规范化；全部阈值与语义不变。
#   合并映射：原PH001+原PH004→PH001；原PH002+原PH003→PH002；原PH005→PH003；
#             原PH007→PH004；原PH009→PH005；原PH008→PH006；原PH010→PH007；
#             原PH011+原PH012→PH008（样本量充足性门控），已于 2026-08-17 删除。

