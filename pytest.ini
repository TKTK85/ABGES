[pytest]
pythonpath =
    .
    tools/Python
    tools/HIBLUP
    tools/PLINK
testpaths = tests/unit
# 【S8】--strict-markers：marker 拼写错误立即报错，不再静默失效。
# 【S8】--cov：覆盖率统计源统一在此声明，便于本地与 CI 口径一致。
#      注意：--cov-fail-under 刻意**不**写在这里——阈值只在 CI 的全量运行中生效，
#      否则单跑某个测试文件会因覆盖率天然偏低而误判失败，破坏本地开发体验。
addopts = --strict-markers --cov=tools/Python --cov=harness --cov=runners --cov=abges_mcp --cov=abges_runtime --cov=tools/HIBLUP --cov=tools/PLINK --cov-branch --cov-report=term-missing

[coverage:run]
branch = False
# 排除测试脚手架与非业务代码，避免覆盖率被稀释
omit =
    */__pycache__/*
    */tests/*
    */_bootstrap.py
